{% extends 'base.html' %}

{% block title %}
Login - Student Management System
{% endblock %}

{% block content %}

<div class="login-page">

    <div class="login-container">

        <div class="login-header">

            <h1>
                Student Management System
            </h1>

            <p>
                Login to your account
            </p>

        </div>


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            {% if messages %}

                <div class="messages">

                    {% for message in messages %}

                        <p>
                            {{ message }}
                        </p>

                    {% endfor %}

                </div>

            {% endif %}


            <button type="submit">
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
