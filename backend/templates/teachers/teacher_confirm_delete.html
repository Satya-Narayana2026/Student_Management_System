{% extends 'base.html' %}

{% block content %}

<div class="form-container">

    <h1>Delete Teacher</h1>

    <p>
        Are you sure you want to delete
        <strong>
            {{ teacher.first_name }} {{ teacher.last_name }}
        </strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <a
            href="{% url 'teachers:teacher_list' %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

        <button
            type="submit"
            class="btn btn-danger"
        >
            Yes, Delete
        </button>

    </form>

</div>

{% endblock %}
