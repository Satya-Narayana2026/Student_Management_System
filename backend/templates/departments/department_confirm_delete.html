{% extends "base.html" %}

{% block title %}
Delete Department - Student Management System
{% endblock %}

{% block content %}

<div class="page-container">

    <div class="delete-container">

        <h1>Delete Department</h1>

        <p>
            Are you sure you want to delete this department?
        </p>


        <div class="delete-info">

            <p>
                <strong>Code:</strong>
                {{ department.code }}
            </p>

            <p>
                <strong>Name:</strong>
                {{ department.name }}
            </p>

        </div>


        <form method="POST">

            {% csrf_token %}

            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-danger"
                >
                    Yes, Delete
                </button>

                <a
                    href="{% url 'departments:department_list' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
