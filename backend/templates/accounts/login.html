{% extends "base.html" %}

{% block title %}
Login - Student Management System
{% endblock %}

{% block content %}

<div class="login-page">

    <div class="login-card">

        <div class="login-header">
            <h1>Welcome Back</h1>
            <p>Login to access the Student Management System</p>
        </div>


        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="username"
                    class="form-control"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary login-btn"
            >
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
